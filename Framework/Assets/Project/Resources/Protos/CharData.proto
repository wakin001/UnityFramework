syntax = "proto2";
option csharp_namespace = "FunPlus.Protobuf.CharData";
package CharData;

message BaseAttrDict
{
	optional int32	charLv =  1;
	optional int32	skNo   =  2;
}
message AttrDict
{
	repeated BaseAttrDict	info =  1;
}
message RoleSkillDict
{
	repeated BaseAttrDict	defaultAtkInfoList  =  1;
	repeated BaseAttrDict	gotAtkInfoList      =  2;
	repeated AttrDict    	activeSkillInfoList =  3;
	repeated int32       	passiveSkillList    =  4;
	repeated BaseAttrDict	aoyiSkillInfoList   =  5;
}
message RoleAttrDict
{
	optional double	baseHp            =  1;
	optional double	baseAtk           =  2;
	optional double	baseDef           =  3;
	optional double	baseHitGrade      =  4;
	optional int32 	baseCaCap         =  5;
	optional double	baseCaEff         =  6;
	optional double	baseHostility     =  7;
	optional double	baseCritRate      =  8;
	optional double	baseCritDmgRate   =  9;
	optional double	baseComboDistRate = 10;
}
message OutputDef
{
	optional int32        	charNo      =  1;
	optional RoleSkillDict	skillDict   =  2;
	optional RoleAttrDict 	attribDict  =  3;
	repeated int32        	skinNoList  =  4;
	optional string       	viewName    =  5;
	optional int32        	mainElement =  6;
}
message TableDef
{
	required int32       	charNo             =  1; //Char_No
	repeated BaseAttrDict	defaultAtkInfoList =  2; //Default_Normal_Attack_Data_No
	repeated BaseAttrDict	gotAtkInfoList     =  3; //Scene_Normal_Attack_Data_No
	repeated BaseAttrDict	proactAtkInfo_1    =  4; //Active_Skill_1_Data_No
	repeated BaseAttrDict	proactAtkInfo_2    =  5; //Active_Skill_2_Data_No
	repeated BaseAttrDict	proactAtkInfo_3    =  6; //Active_Skill_3_Data_No
	repeated int32       	passiveSkillList   =  7; //Passive_Skill_List
	repeated BaseAttrDict	aoyiSkillInfoList  =  8; //Ca_Skill_Data_No
	repeated int32       	skinNoList         =  9; //Skin_List
	optional string      	viewName           = 10; //Char_Name
	optional int32       	mainElement        = 11; //Main_Element
	optional double      	baseHp             = 12; //Base_Hp
	optional double      	baseAtk            = 13; //Base_Atk
	optional double      	baseDef            = 14; //Base_Def
	optional double      	baseHitGrade       = 15; //Base_Hit_Grade
	optional int32       	baseCaCap          = 16; //Base_Ca_Cap
	optional double      	baseCaEff          = 17; //Base_Ca_Eff
	optional double      	baseHostility      = 18; //Base_Hostility
	optional double      	baseCritRate       = 19; //Base_Crit_Rate
	optional double      	baseCritDmgRate    = 20; //Base_Crit_Damage_Rate
	optional double      	baseComboDistRate  = 21; //Base_Combo_Dist_Rate
}
